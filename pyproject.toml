[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotrace-sdk"
version = "2.0.0"
description = "OTel-native Python SDK for robot observability — mission tracing, sensor telemetry, and evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "RoboSwarm Team", email = "sdk@robotrace.io" }]
keywords = ["robotics", "telemetry", "tracing", "opentelemetry", "observability", "rosp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcap = [
    "mcap>=1.1,<2",
    "zstandard>=0.19",
]
commands = [
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://robotrace.io"
Documentation = "https://docs.robotrace.io"
Source = "https://github.com/roboswarm/robotrace-sdk"

[tool.hatch.build.targets.sdist]
exclude = [".robotrace/", ".pytest_cache/", "__pycache__/"]

[tool.hatch.build.targets.wheel]
packages = ["robotrace"]
exclude = [".robotrace/", ".pytest_cache/", "__pycache__/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
